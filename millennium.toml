[plugin]
id = "steam-actions"
name = "Steam Actions"
version = "1.0.2"
author = "Steam Actions"
description = "Adds a native-style Actions menu to Steam Store and Library game pages."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "FRT"
webview_prefix  = "WEB"
